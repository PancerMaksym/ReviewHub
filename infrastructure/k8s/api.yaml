kind: Deployment
apiVersion: apps/v1
metadata:
  name: api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-hub-api
  template:
    metadata:
      labels:
        app: review-hub-api
    spec:
      containers:
        - name: nest-api
          image: pantsyrmaksym/review-hub-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 100Mi

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: ClusterIP
  selector:
    app: review-hub-api
  ports:
    - port: 3000
      targetPort: 3000
