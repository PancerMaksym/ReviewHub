apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: review-hub-ingress
spec:
  ingressClassName: traefik

  rules:
    - host: myapp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 3000
