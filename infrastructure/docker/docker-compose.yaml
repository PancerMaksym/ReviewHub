services:
  auth:
    build:
      context: ../..
      dockerfile: apps/auth-service/Dockerfile
    image: pantsyrmaksym/review-hub-auth:latest
    ports:
      - '3001:3000'
  api:
    build:
      context: ../..
      dockerfile: apps/api-gateway/Dockerfile
    image: pantsyrmaksym/review-hub-api:latest
    ports:
      - '3002:3000'
